<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>MARSHGO — візуальний перегляд</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; }
      body { display: grid; place-items: center; overflow: auto; background: #050b12; }
      .device-preview { width: min(100vw, 430px); height: min(100dvh, 932px); min-height: 568px; overflow: hidden; background: #081421; box-shadow: 0 24px 90px rgba(0,0,0,.55); }
      .device-preview iframe { display: block; width: 100%; height: 100%; border: 0; }
      @media (max-width: 430px) { .device-preview { height: 100dvh; min-height: 0; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main class="device-preview" aria-label="Попередній перегляд MARSHGO на телефоні">
      <iframe src="/tests/visual/signature-navigation.html" title="MARSHGO — тестовий перегляд маршруту"></iframe>
    </main>
    <script>
      const viewport = new URLSearchParams(location.search).get('viewport')?.match(/^(320|375|390|430)x(568|667|812|844|932)$/);
      if (viewport) {
        const frame = document.querySelector('.device-preview');
        frame.style.width = `${viewport[1]}px`;
        frame.style.height = `${viewport[2]}px`;
        frame.style.minHeight = '0px';
      }
    </script>
  </body>
</html>
