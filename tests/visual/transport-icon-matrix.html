<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>MARSHGO — матриця транспортних піктограм</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      body { background: #09111d; color: #f3f7fc; font: 14px system-ui, sans-serif; }
      main { min-height: 100svh; display: grid; place-items: center; padding: 16px; }
      .icon-grid { width: min(100%, 430px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .icon-tile { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid #29384a; border-radius: 17px; background: #101c2b; color: #f3f7fc; }
      .icon-tile svg { width: var(--icon-size, 32px); height: var(--icon-size, 32px); }
      @media (max-width: 360px) { .icon-grid { gap: 7px; } .icon-tile { border-radius: 14px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const requested = Number(new URLSearchParams(location.search).get('size'));
      const iconSize = [16, 20, 24, 32].includes(requested) ? requested : 32;
      document.documentElement.style.setProperty('--icon-size', `${iconSize}px`);
    </script>
    <script type="module" src="./transport-icon-matrix.tsx"></script>
  </body>
</html>
