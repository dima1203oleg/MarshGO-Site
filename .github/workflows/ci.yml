name: Site CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test suite (tsx --test tests/*.test.ts)
        run: npm test
      - run: npm run build
      - run: npm run check:bundle
