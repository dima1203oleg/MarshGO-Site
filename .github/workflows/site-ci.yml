name: Site CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'tsconfig.e2e.json'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/site-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Site
    runs-on: ubuntu-latest
    # Ubuntu 24.04's Playwright system-dependency install can take >20 minutes
    # when the hosted runner must fetch the full WebKit media/GTK dependency set.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck browser acceptance tests
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle size gate
        run: npm run check:bundle

      - name: Cache Playwright browser binaries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers for browser acceptance
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser acceptance against production build
        run: npm run test:e2e

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marshgo-site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
