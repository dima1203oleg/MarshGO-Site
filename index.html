<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MARSHGO — Один пошук. Усі способи доїхати</title>
    <meta name="description" content="Один пошук. Усі способи доїхати. Попутки, таксі, автобуси, трансфери та розумна навігація з підбором попутників." />
    <meta property="og:title" content="MARSHGO — Транспортний маркетплейс" />
    <meta property="og:description" content="Один пошук. Усі способи доїхати. Попутка, таксі, автобуси, маршрутки, каршеринг та навігація." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#071521" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MARSHGO" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      .boot-notice { min-height: 100vh; display: grid; place-content: center; gap: 14px; padding: 24px; background: #f3f7fc; color: #14243b; font: 600 16px system-ui, sans-serif; text-align: center; }
      .boot-notice button { justify-self: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #1769f4; color: #fff; font: inherit; cursor: pointer; }
      .boot-dark .boot-notice { background: #071521; color: #F5F8FC; }
    </style>
    <script>
      // The bundle carries the theme sheet, so the shell reads the same key the app writes.
      // Dark is the default, so only an explicit light choice — or a system choice on a light OS —
      // may paint the light shell; otherwise the first frame flashes white before the app boots.
      try {
        const saved = localStorage.getItem('mg_theme');
        const dark = saved === 'light' ? false : saved === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true;
        if (dark) document.documentElement.classList.add('boot-dark');
      } catch {
        // Private mode: storage is unavailable, so the app itself will also fall back to dark.
        document.documentElement.classList.add('boot-dark');
      }
    </script>
  </head>
  <body class="bg-[#F5F8FD] text-[#14243B] antialiased selection:bg-[#1769F4] selection:text-white">
    <div id="root"><main class="boot-notice"><p>Відкриваємо MARSHGO…</p></main></div>
    <script>
      (() => {
        const show = (message, retry) => {
          const root = document.getElementById('root');
          if (!root) return;
          const main = document.createElement('main');
          main.className = 'boot-notice';
          const text = document.createElement('p');
          text.textContent = message;
          main.append(text);
          if (retry) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = 'Спробувати ще раз';
            button.onclick = () => location.reload();
            main.append(button);
          }
          root.replaceChildren(main);
        };
        const downloading = () => document.readyState !== 'complete'
          || performance.getEntriesByType('resource').some(entry => entry.responseEnd === 0);
        // A slow first download over a tunnel is not a crash: say so only once the load itself has settled.
        const check = deadline => () => {
          if (window.__MARSHGO_BOOTED__) return;
          if (Date.now() < deadline && downloading()) return;
          show(downloading()
            ? 'MARSHGO завантажується надто довго. Перевірте з’єднання.'
            : 'Не вдалося запустити MARSHGO.', true);
        };
        addEventListener('error', check(0));
        addEventListener('unhandledrejection', check(0));
        setTimeout(check(Date.now() + 45000), 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
