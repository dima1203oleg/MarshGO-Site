<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MARSHGO — Один пошук. Усі способи доїхати</title>
    <meta name="description" content="Один пошук. Усі способи доїхати. Попутки, таксі, автобуси, трансфери та розумна навігація з підбором попутників." />
    <meta property="og:title" content="MARSHGO — Транспортний маркетплейс" />
    <meta property="og:description" content="Один пошук. Усі способи доїхати. Попутка, таксі, автобуси, маршрутки, каршеринг та навігація." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#081B35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MARSHGO" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F8FD] text-[#14243B] antialiased selection:bg-[#1769F4] selection:text-white">
    <div id="root"><main style="min-height:100vh;display:grid;place-items:center;background:#f3f7fc;color:#14243b;font:600 16px system-ui,sans-serif">Відкриваємо MARSHGO…</main></div>
    <script>
      function showBootFailure(message) {
        const root = document.getElementById('root');
        if (!root || window.__MARSHGO_BOOTED__) return;

        const main = document.createElement('main');
        main.setAttribute('role', 'alert');
        main.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f7fc;color:#14243b;font:600 16px system-ui,sans-serif;text-align:center';

        const section = document.createElement('section');
        section.style.cssText = 'width:min(100%,420px);display:grid;justify-items:center;gap:16px';
        const text = document.createElement('p');
        text.textContent = message;
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'Спробувати ще раз';
        retry.style.cssText = 'min-height:48px;border:0;border-radius:16px;padding:12px 24px;background:#1769f4;color:white;font:700 16px system-ui,sans-serif;cursor:pointer';
        retry.addEventListener('click', () => window.location.reload());
        section.append(text, retry);
        main.append(section);
        root.replaceChildren(main);
      }

      // Resource load errors (including a stale/missing release chunk) do not
      // bubble, so catch them during capture before the app has mounted.
      window.addEventListener('error', () => {
        showBootFailure('Не вдалося завантажити MARSHGO. Перевірте з’єднання й спробуйте ще раз.');
      }, true);
      window.addEventListener('unhandledrejection', () => {
        showBootFailure('Виникла помилка запуску MARSHGO. Перевірте з’єднання й спробуйте ще раз.');
      });
      window.setTimeout(() => {
        if (window.__MARSHGO_BOOTED__) return;
        showBootFailure('MARSHGO завантажується надто довго. Перевірте з’єднання й спробуйте ще раз.');
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
